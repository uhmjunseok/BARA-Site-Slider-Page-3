<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BARA Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    :root{--vh:1vh}
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;overscroll-behavior:none}
    .app{height:calc(var(--vh)*100)}
    .swiper{height:100%;touch-action:pan-y}
    .swiper-slide{height:50%!important;display:flex;align-items:center;justify-content:center}
    .frame{position:relative;height:100%;aspect-ratio:16/9;cursor:pointer}
    .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .play{position:absolute;inset:0;margin:auto;width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-left:30px solid #fff;pointer-events:none;opacity:.9}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .is-playing .thumb,.is-playing .play{opacity:0}
  </style>
</head>
<body>
<div class="app">
  <div class="swiper">
    <div class="swiper-wrapper">

      <div class="swiper-slide"><div class="frame" data-video="5kwdU60Xqh8">
        <img class="thumb" src="https://res.cloudinary.com/dlzutetki/image/upload/v1765910009/aespa_1_clfpii.jpg" alt=""><div class="play"></div>
      </div></div>

      <div class="swiper-slide"><div class="frame" data-video="YoARK1ZGfiw">
        <img class="thumb" src="https://res.cloudinary.com/dlzutetki/image/upload/v1765910010/aespa_3_syyxob.jpg" alt=""><div class="play"></div>
      </div></div>

      <div class="swiper-slide"><div class="frame" data-video="oUH3ywua_0w">
        <img class="thumb" src="https://res.cloudinary.com/dlzutetki/image/upload/v1765910010/aespa_2_i58fal.jpg" alt=""><div class="play"></div>
      </div></div>

      <div class="swiper-slide"><div class="frame" data-video="D7vNuz1WVxU">
        <img class="thumb" src="https://res.cloudinary.com/dlzutetki/image/upload/v1765920114/IRENE_SEULGI.jpg_uwwnye.webp" alt=""><div class="play"></div>
      </div></div>

      <div class="swiper-slide"><div class="frame" data-video="FZJLu2uHEtM">
        <img class="thumb" src="https://res.cloudinary.com/dlzutetki/image/upload/v1765922965/TXT_1_cgtu2u.jpg" alt=""><div class="play"></div>
      </div></div>

      <div class="swiper-slide"><div class="frame" data-video="S-uJLjxkKS4">
        <img class="thumb" src="https://res.cloudinary.com/dlzutetki/image/upload/v1765922965/TXT_2_z4t4ny.jpg" alt=""><div class="play"></div>
      </div></div>

      <div class="swiper-slide"><div class="frame" data-video="ZzQcUe0_XFQ">
        <img class="thumb" src="https://res.cloudinary.com/dlzutetki/image/upload/v1765922966/TXT_3_l7kfvf.jpg" alt=""><div class="play"></div>
      </div></div>

      <div class="swiper-slide"><div class="frame" data-video="ANRk61jJfAQ">
        <img class="thumb" src="https://res.cloudinary.com/dlzutetki/image/upload/v1765926235/ZEROBASEONE_%EC%A0%9C%EB%A1%9C%EB%B2%A0%EC%9D%B4%EC%8A%A4%EC%9B%90_The_4th_Mini_Album____BAD_Film_2_dxmdpi.jpg" alt=""><div class="play"></div>
      </div></div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
/* =========================
   1) vh 계산: zoom에서도 안정적으로
   - visualViewport 우선
========================= */
function setVh(){
  var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
}
setVh();
window.addEventListener('resize', setVh);
if (window.visualViewport) window.visualViewport.addEventListener('resize', setVh);

/* =========================
   2) Swiper
========================= */
const swiper = new Swiper('.swiper', {
  direction:'vertical',
  slidesPerView:2,
  speed:280,
  nested:true,
  touchStartPreventDefault:false,
  resistanceRatio:0.85,
  observer:true,
  observeParents:true,
  mousewheel:{forceToAxis:true,sensitivity:0.6,thresholdDelta:30,thresholdTime:250}
});

/* =========================
   3) zoom/viewport 변화 대응:
   - 줌 변경은 "resize"가 애매하게 들어오는 경우가 있어
     visualViewport + RAF + update 강제
========================= */
function hardRelayout(){
  // vh 재계산
  setVh();

  // Swiper 레이아웃 강제 재계산
  try {
    swiper.updateSize();
    swiper.updateSlides();
    swiper.updateProgress();
    swiper.updateSlidesClasses();
    swiper.update();
  } catch(e){}

  // iOS/크롬에서 가끔 터치가 죽는 케이스 방지
  try { swiper.mousewheel && swiper.mousewheel.enable && swiper.mousewheel.enable(); } catch(e){}
}

// 줌/주소창/탭전환 등으로 viewport가 바뀔 때
window.addEventListener('orientationchange', ()=>setTimeout(hardRelayout, 200));
window.addEventListener('pageshow', ()=>setTimeout(hardRelayout, 0));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(hardRelayout, 0); });

// visualViewport가 있으면 이게 "줌"을 가장 잘 잡음
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{
    requestAnimationFrame(()=>requestAnimationFrame(hardRelayout));
  });
}

/* =========================
   4) 플레이 로직 (너 기존 그대로)
========================= */
const frames = Array.from(document.querySelectorAll('.frame'));

function stopOthers(c){
  frames.forEach(f=>{
    if(f!==c){
      f.classList.remove('is-playing');
      const i=f.querySelector('iframe');
      if(i) i.remove();
    }
  });
}

function notify(videoId){
  const msg = { type:'BARA_VIDEO_SELECT', videoId };
  try { window.top.postMessage(msg, '*'); } catch(e) {}
}

frames.forEach(f=>{
  f.addEventListener('click', ()=>{
    if(f.classList.contains('is-playing')) return;

    const id = f.dataset.video;
    stopOthers(f);

    const i = document.createElement('iframe');
    i.src = `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0`;
    i.allow = 'autoplay; encrypted-media; picture-in-picture';
    i.allowFullscreen = true;

    f.appendChild(i);
    f.classList.add('is-playing');
    notify(id);
  }, { passive:true });
});

swiper.on('slideChange', ()=>{
  const f = swiper.slides[swiper.activeIndex]?.querySelector('.frame');
  if(f) notify(f.dataset.video);
});

// 첫 렌더에서도 한 번 정렬
setTimeout(hardRelayout, 0);
setTimeout(hardRelayout, 200);
</script>
</body>
</html>
