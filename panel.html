<!-- ✅ Page 3: panel.html 전체 교체본 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MICROCOSM Panel (Page 3)</title>

  <style>
    html, body{
      margin:0;
      padding:0;
      height:100%;
      background:transparent;
      overflow:hidden;

      font-family:"Aktiv Grotesk","AktivGrotesk",Arial,sans-serif;
      font-size:15px;

      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;

      letter-spacing:-0.3px;
      line-height:1.2;
      color:#111;
    }

    .root{
      height:100%;
      padding:24px;
      box-sizing:border-box;
      background:transparent;
    }

    .mt-title{ margin-bottom:6px; }
    .mt-sub{ margin-bottom:14px; }

    .mt-desc{
      margin-bottom:14px;
      max-width:60ch;

      /* ✅ 길면 자동 줄바꿈 */
      white-space:normal;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    .mt-year{ opacity:.8; }
  </style>
</head>

<body>
  <div class="root">
    <div class="mt-title" id="mtTitle">MICROCOSM</div>
    <div class="mt-sub" id="mtSub">A compact study of sound, rhythm, and presence.</div>
    <div class="mt-desc" id="mtDesc"></div>
    <div class="mt-year" id="mtYear">2025</div>
  </div>

  <script>
  (function(){
    const DATA = {
      /* ✅ Page 3 MICROCOSM IDs */
      'DRPC2Ba7i7E': {
        title:'MICROCOSM I',
        sub:'RHYTHM',
        desc:'A form appears, holds, and subtly disturbs the stillness of an office interior.',
        year:'2025'
      },
      'Rp0HBSVz4hg': {
        title:'MICROCOSM II',
        sub:'INTRUSION',
        desc:'Particles drift and cluster, exposing surface and texture through slow accumulation.',
        year:'2025'
      },
      'EBvlq_t6CHA': {
        title:'MICROCOSM III',
        sub:'SPREAD',
        desc:'Elements expand and overlap, producing a continuous yet unstable spatial flow.',
        year:'2025'
      },
      'TldWk1-rzIA': {
        title:'MICROCOSM IV',
        sub:'DISRUPTION',
        desc:'Irregular movements interrupt the system, leaving residual patterns and breaks in rhythm.',
        year:'2025'
      }
    };

    const titleEl = document.getElementById('mtTitle');
    const subEl   = document.getElementById('mtSub');
    const descEl  = document.getElementById('mtDesc');
    const yearEl  = document.getElementById('mtYear');
    if (!titleEl || !subEl || !descEl || !yearEl) return;

    function setDefault(){
      titleEl.textContent = 'MICROCOSM';
      subEl.textContent   = 'A compact study of sound, rhythm, and presence.';
      descEl.textContent  = '';
      yearEl.textContent  = '2025';
    }

    function apply(videoId){
      const d = DATA[videoId];
      if (!d){ setDefault(); return; }
      titleEl.textContent = d.title;
      subEl.textContent   = d.sub;
      descEl.textContent  = d.desc;
      yearEl.textContent  = d.year || '2025';
    }

    window.addEventListener('message', function(ev){
      const data = ev.data;
      if (!data || data.type !== 'BARA_VIDEO_SELECT') return;
      apply(data.videoId);
    });

    setDefault();
  })();
  </script>
</body>
</html>
